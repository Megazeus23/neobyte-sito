<!doctype html><meta charset="utf-8"><title>Icona dello studio</title>
<!-- Modello per strumenti/icone.py: il simbolo del logo su fondo spaziale, quadrato. Parametro: ?logo=<nome in logo/> -->
<style>html,body{margin:0;height:100%;background:#03040b}body{display:grid;place-items:center;background:radial-gradient(circle at 70% 20%,#1a2a7a 0,#070b22 45%,#03040b 80%)}img{width:86%;height:86%;filter:drop-shadow(0 0 4vmin rgba(110,190,255,.55))}</style>
<img id="i" alt=""><script>document.getElementById('i').src = '../../logo/' + new URLSearchParams(location.search).get('logo') + '-simbolo.svg'</script>
